<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../public/scriptrunner.css"></head><body><div id="devListToolbar"><input id="zabbix-bulk-open" type="button" value="Zabbix"></div><script>
var serverPublicNamePort='',authCookie='',authRelayCookie='',domainUrl='',currentAttempt='',events=[],files={};
function getCheckedDevices(){return ['node//test'];} function getNodeFromId(id){return {_id:id,name:'sokol',conn:1};}

function CreateAgentRedirect(server,protocol){var o={};o.Start=function(){setTimeout(function(){o.onStateChanged(o,3);},0);};o.Stop=function(){};o.send=function(){setTimeout(function(){protocol.message({action:'uploadack',reqid:1});},0);};o.sendText=function(text){var m=JSON.parse(text);if(m.action==='ls'){if(protocol.binary)throw Error('Listing channel must not install a binary handler');var names=m.reqid===71?['br_prepare_'+currentAttempt+'.ok']:['br_'+currentAttempt+'.result.json'];setTimeout(function(){protocol.message({reqid:m.reqid,dir:names.map(function(n){return {n:n};})});},0);}else if(m.action==='upload'){setTimeout(function(){protocol.message({action:'uploadstart',reqid:1});},0);}else if(m.action==='uploaddone'){setTimeout(function(){protocol.message({action:'uploaddone',reqid:1});},0);}else if(m.action==='download'&&m.sub==='start'){o.path=m.path;setTimeout(function(){protocol.message({action:'download',sub:'start',id:m.id});},0);}else if(m.action==='download'&&m.sub==='startack'){var s=o.path.endsWith('.result.json')?JSON.stringify({attempt_id:currentAttempt,exit_code:0,error:null}):o.path.endsWith('.stdout.log')?'BR_MOCK_OK':'';var bytes=new TextEncoder().encode(s),frame=new Uint8Array(bytes.length+4);frame[3]=1;frame.set(bytes,4);setTimeout(function(){protocol.binary(frame);},0);}};return o;}
